# Alembic configuration for RecoverFlow API
# This file is read by `alembic` CLI commands.
# The actual DB URL is injected from environment variables in alembic/env.py
# so this file NEVER contains credentials.

[alembic]
# Path to migration scripts (relative to this file's directory)
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Max length of auto-generated migration file slug
truncate_slug_length = 40

# Version path separator (os, |, :, space)
version_path_separator = os

# Output encoding
output_encoding = utf-8

[post_write_hooks]
# No post-write hooks in Phase 0.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
